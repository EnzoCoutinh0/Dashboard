<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Tempo Juntos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 15, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 50, 0.3);
            border: 1px solid rgba(255, 71, 87, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            color: #ffffff;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff4757;
            font-size: 3.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(255, 71, 87, 0.5);
        }

        .counter-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .time {
            background: rgba(255, 71, 87, 0.15);
            color: #ffcccc;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #ff4757;
            font-size: 1.5rem;
            font-weight: bold;
            min-width: 60px;
            box-shadow: 0 4px 15px rgba(255, 0, 50, 0.2);
        }

        .time span {
            display: block;
            font-size: 0.8rem;
            font-weight: 300;
            color: #ffffff;
            margin-top: 5px;
        }

       /* Estilo do Carrossel de Fotos */
        .slider-container {
            position: relative;
            width: 100%;
            height: 350px; /* Aumentei um pouquinho a altura para ficar melhor para fotos em pé */
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            background-color: #000000; /* Fundo preto onde a foto não preencher */
            border: 2px solid rgba(255, 71, 87, 0.2);
            margin-bottom: 20px;
        }

        .slider-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ESSA É A MÁGICA: mudamos de 'cover' para 'contain' */
            transition: opacity 0.5s ease-in-out;
        }

        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff4757;
            color: #ff4757;
            font-size: 24px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff4757;
            color: white;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        .spotify-container {
            width: 100%;
            margin-top: 10px;
        }

        .heart {
            position: absolute;
            top: -10vh;
            color: #ff0000;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: 5;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .lily-bg {
            position: absolute;
            z-index: 1;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nosso Tempo Juntos</h1>
        
        <div class="counter-box">
            <div class="time" id="days">00<span>Dias</span></div>
            <div class="time" id="hours">00<span>Horas</span></div>
            <div class="time" id="minutes">00<span>Minutos</span></div>
            <div class="time" id="seconds">00<span>Segundos</span></div>
        </div>

        <div class="slider-container">
            <button class="btn prev" onclick="mudarFoto(-1)">&#10094;</button>
            <!-- AQUI FOI CORRIGIDO A FOTO INICIAL PARA A SUA PRIMEIRA FOTO -->
           <img id="fotoSlider" src="Foto1.jpg" alt="Nossa Foto">
            <button class="btn next" onclick="mudarFoto(1)">&#10095;</button>
        </div>

        <div class="spotify-container"> /musica spotify só colocar outra! /
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/0ZPquQV2aKmDfwPjvMdvRp?utm_source=generator&theme=0&si=ac2d63bfedf64c88" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        const dataInicio = new Date(2026, 5, 20, 0, 0, 0).getTime();

        function atualizarContador() {
            const agora = new Date().getTime();
            const diferenca = agora - dataInicio;
            const diffAbsoluta = Math.abs(diferenca);

            const dias = Math.floor(diffAbsoluta / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diffAbsoluta % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diffAbsoluta % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diffAbsoluta % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = dias + "<span>Dias</span>";
            document.getElementById("hours").innerHTML = (horas < 10 ? "0" + horas : horas) + "<span>Horas</span>";
            document.getElementById("minutes").innerHTML = (minutos < 10 ? "0" + minutos : minutos) + "<span>Minutos</span>";
            document.getElementById("seconds").innerHTML = (segundos < 10 ? "0" + segundos : segundos) + "<span>Segundos</span>";
        }

        setInterval(atualizarContador, 1000);
        atualizarContador();

        /* =========================================
           AQUI ESTÁ A LISTA DE FOTOS
           ========================================= */
        const fotos = [
            "Foto1.jpg",
            "Foto2.jpg",
            "Foto3.jpg",
            

        ];
        
        let indiceAtual = 0;
        const elementoFoto = document.getElementById("fotoSlider");

        function mudarFoto(direcao) {
            indiceAtual += direcao;
            if (indiceAtual >= fotos.length) indiceAtual = 0;
            if (indiceAtual < 0) indiceAtual = fotos.length - 1;

            elementoFoto.style.opacity = 0;
            setTimeout(() => {
                elementoFoto.src = fotos[indiceAtual];
                elementoFoto.style.opacity = 1;
            }, 200);
        }

        function criarCoracao() {
            const coracao = document.createElement("div");
            coracao.classList.add("heart");
            coracao.innerHTML = "❤";
            
            coracao.style.left = Math.random() * 100 + "vw";
            coracao.style.fontSize = Math.random() * 20 + 10 + "px";
            coracao.style.animationDuration = Math.random() * 3 + 3 + "s";

            document.body.appendChild(coracao);

            setTimeout(() => {
                coracao.remove();
            }, 6000);
        }
        setInterval(criarCoracao, 300);

        function espalharLirios() {
            const quantidadeDeLirios = 15; 

            for (let i = 0; i < quantidadeDeLirios; i++) {
                const lirio = document.createElement("img");
                lirio.src = "https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/512/emoji_u1f33a.png"; 
                lirio.classList.add("lily-bg");
                lirio.style.left = Math.random() * 100 + "vw";
                lirio.style.top = Math.random() * 100 + "vh";
                lirio.style.width = (Math.random() * 60 + 40) + "px";
                lirio.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
                document.body.appendChild(lirio);
            }
        }
        espalharLirios();

    </script>
</body>
</html>
